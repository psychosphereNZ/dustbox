name: Build DUSTBOX 12

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: DUSTBOX12-${{ runner.os }}
          path: |
            build/Dustbox12_artefacts/Release/VST3
            build/Dustbox12_artefacts/Release/AU
            build/Dustbox12_artefacts/Release/Standalone
          if-no-files-found: error
